spring:
  application:
    name: subscriptions-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/subscriptions}
    username: ${DATABASE_USER:app}
    password: ${DATABASE_PASSWORD:app}
  jpa:
    # El esquema lo controla Flyway; Hibernate solo comprueba que las entidades encajan.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

billing:
  # Cada día a las 02:00 (hora del servidor). Se puede sobreescribir por entorno.
  renewal-cron: ${BILLING_RENEWAL_CRON:0 0 2 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
