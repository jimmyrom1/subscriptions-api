name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: mvn verify (unit + Testcontainers + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Los tests de integración levantan PostgreSQL con Testcontainers (Docker viene en el runner).
      - run: ./mvnw -B verify
      - name: Informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build
      - name: Esperar a que la app arranque
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/actuator/health && exit 0
            sleep 2
          done
          exit 1
      - name: Flujo completo por HTTP
        run: |
          set -e
          H='Content-Type: application/json'
          curl -fsS localhost:8080/api/plans | grep -q PREMIUM
          curl -fsS -X POST localhost:8080/api/customers -H "$H" -d '{"email":"ci@example.com","fullName":"CI"}'
          curl -fsS -X POST localhost:8080/api/customers/1/subscriptions -H "$H" -d '{"planCode":"PREMIUM"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/customers/1/subscriptions -H "$H" -d '{"planCode":"METAL"}')" = 409
          curl -fsS -X PUT localhost:8080/api/subscriptions/1/plan -H "$H" -d '{"planCode":"METAL"}' | grep -q PRORATION
          curl -fsS localhost:8080/v3/api-docs | grep -q '/api/subscriptions/{id}/cancel'
      - name: Logs si falla
        if: failure()
        run: docker compose logs
